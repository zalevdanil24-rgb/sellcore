# Локальная база для разработки: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sellcore
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sellcore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
